<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal CURP</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body><header><strong>Portal CURP</strong></header><main>
<h1>Portal CURP</h1><p>Completa el formulario para registrar un envío de datos ficticios.</p>
<p class="notice"><strong>Página personal no oficial.</strong> verifica CURP. Solo admite datos.</p>
<section><h2>Registrar datos</h2><form id="demo-form">
<label for="first_name">first_name</label><input id="first_name" name="first_name" type="text" maxlength="250" placeholder="" required autocomplete="off">
<label for="last_name">last_name</label><input id="last_name" name="last_name" type="text" maxlength="250" placeholder="" required autocomplete="off">
<label for="curp">CURP </label><input id="curp" name="curp" type="text" maxlength="250" placeholder="CURP" autocomplete="off">
<label for="rfc">RFC</label><input id="rfc" name="rfc" type="text" maxlength="250" placeholder="RFC" required autocomplete="off">
<label for="nss">NSS</label><input id="nss" name="nss" type="text" maxlength="250" placeholder="NSS" required autocomplete="off">
<label for="address">address</label><input id="address" name="address" type="text" maxlength="250" placeholder="Calle" required autocomplete="off">
<label for="phone">phone</label><input id="phone" name="phone" type="text" maxlength="250" placeholder="TELEFONO" required autocomplete="off">
<label for="email">email</label><input id="email" name="email" type="text" maxlength="250" placeholder="persona@example.com" required autocomplete="off">
<label class="confirmation"><input type="checkbox" id="synthetic" name="synthetic" required> .</label>
<button type="submit">Enviar datos</button><p id="send-status" role="status" aria-live="polite"></p></form></section>
<section><h2>Envíos recientes · Lista pública</h2><p>Se actualiza cada 2 segundos.</p><p id="list-status" role="status"></p><div id="records"></div></section>
</main></body></html>
